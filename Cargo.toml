[package]
name = "rt"
version = "0.1.0"
edition = "2021"
description = "Ray tracer with shapes, lighting, textures, reflection, refraction, particles, and fluid surface"
license = "MIT OR Apache-2.0"

[dependencies]
glam = "0.29"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
image = "0.25"
rand = "0.8"
noise = "0.9"
eframe = { version = "0.29", optional = true, default-features = false, features = [
    "glow",
    "default_fonts",
] }
egui = { version = "0.29", optional = true }

[features]
default = []
gui = ["dep:eframe", "dep:egui"]

[profile.release]
lto = true
codegen-units = 1
